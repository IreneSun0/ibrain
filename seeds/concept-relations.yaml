  concept:ask:
    prerequisites: []
    relations:
      - {id: "concept:order-book", rel: component-of}
  concept:spread:
    prerequisites: ["concept:bid", "concept:ask"]   # 定义字面 = best ask − best bid
    relations: []
  concept:depth:
    prerequisites: ["concept:order-book"]
    relations: []
