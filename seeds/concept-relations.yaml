    prerequisites: ["concept:derivative"]
    relations:
      - {id: "concept:derivative", rel: special-case-of, note: "支付取决于现实事件的衍生合约 (CFTC 语境按 DCM 事件合约归类)"}
      - {id: "concept:binary-option", rel: see-also, note: "支付结构经济等同, 法律分类不同 — 摊开 payoff 图即二元期权"}
      - {id: "venue:kalshi", rel: instantiated-by, note: "美国联邦持牌事件合约交易所"}
