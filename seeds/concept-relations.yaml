    prerequisites: ["concept:depth"]
    relations: []
  concept:adverse-selection:
    prerequisites: ["concept:market-maker"]
    relations:
      - {id: "concept:market-maker", rel: risk-of, note: "做市两大成本之一: 知情对手只在报价不利时来成交"}
      - {id: "concept:spread", rel: mitigated-by, note: "做市商拉宽价差为知情流付费"}
  concept:inventory-risk:
    prerequisites: ["concept:market-maker"]
    relations:
      - {id: "concept:market-maker", rel: risk-of, note: "做市两大成本之一: 未对冲库存暴露于价格波动"}
      - {id: "concept:adverse-selection", rel: contrasts-with, note: "库存价格风险 vs 信息不对称风险 — 做市的两大成本来源"}
