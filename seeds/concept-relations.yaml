# 概念语义关联层 · 判断数据 (2026-08-27, Claude seed, 待 Irene 复核)
#
# 本文件是一次性判断记录: apply_concept_relations.py 把它合入各概念页 frontmatter 后,
# frontmatter 即唯一真理源; 后续修正直接改页面, 不回写本文件。
#
# 判断纪律 (见 90_META/taxonomy/relationship-types.md 概念级词表):
# - prerequisites 只填硬前置 (「不先懂 A 就真的看不懂本页」), 不填传递闭包, 不填泛泛相关;
#   为空 = 判断过的空 (词汇层根概念可自立理解)。
# - relations 读法 =「本页 —rel→ 目标」, 每条边只存一次 (语义主语侧), 反向由展示层渲染。
# - instantiated-by 只挂库内实体页内容能支撑的实例; 抽象过程/度量/风险类概念 (price-discovery,
#   spread, hedging, event-var, resolution 等) 不硬挂实体 — 库里无对应实体页, 判断为「不挂」而非遗漏。
#   风险概念有库内实证案例的用 see-also 挂 (如 oracle-risk → uma)。
# - risk-engine / policy-engine 为 tier-1 但库内暂无可支撑的实体实例 (ChainUp 是白标交易所技术,
#   不能凭联想升格为风控引擎实例) — 留空, 待实体层扩充。

concepts:

  # ── Stage 1 · financial-markets ──────────────────────────────
  concept:financial-markets:
    prerequisites: []
    relations: []
  concept:equity:
    prerequisites: []
    relations: []   # 对照边存 debt 页 (其定义引用股权受偿顺序)
  concept:debt:
    prerequisites: []
    relations:
      - {id: "concept:equity", rel: contrasts-with, note: "固定上限收益+优先受偿 vs 剩余索取权+收益不封顶"}
  concept:price-discovery:
    prerequisites: ["concept:financial-markets"]
    relations: []
  concept:broker:
    prerequisites: []
