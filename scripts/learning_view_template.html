<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iBrain — a prediction-market knowledge base</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#68738a; --line:#e3e7ee;
    --accent:#2f6fed; --accent-soft:#e8f0ff;
    --done:#2e9e6b; --done-soft:#e6f5ee;
    --pill:#eef1f6; --pill-hover:#e2e8f2; --focus-ring:#2f6fed;
    --def-bg:#f2f5fa; --note:#8a93a8; --warn:#d98324; --shadow:0 1px 3px rgba(20,30,60,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --panel:#1a1f2a; --ink:#e7ebf4; --muted:#98a2b8; --line:#2a3140;
      --accent:#6f9bff; --accent-soft:#233150;
      --done:#3db584; --done-soft:#173327;
      --pill:#232937; --pill-hover:#2c3446; --def-bg:#202633; --note:#7f8aa3;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  a{color:var(--accent);text-decoration:none}
  .top{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .top h1{font-size:16px;margin:0;white-space:nowrap}
  .top .sub{color:var(--muted);font-size:12px;font-weight:400}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .tagline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;gap:2px;background:var(--pill);border-radius:8px;padding:2px;flex:0 0 auto}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
    padding:4px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .seg.lang button{font-size:11.5px;padding:4px 9px}

  .training{margin:14px 20px 0;padding:12px 16px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .training .count{font-size:13px;line-height:1.6}
  .training .count b{font-size:17px}
  .training .bars{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
  .sbar{display:flex;align-items:center;gap:8px;font-size:12px}
  .sbar .lbl{width:70px;color:var(--muted);white-space:nowrap}
  .sbar .track{flex:1;height:9px;background:var(--pill);border-radius:5px;position:relative;overflow:hidden}
  .sbar .fill{height:100%;border-radius:5px;background:var(--accent)}
  .sbar .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
  .sbar .val{width:64px;text-align:right;font-variant-numeric:tabular-nums}
  .training .now{font-size:12px;color:var(--muted)}
  .training .now b{color:var(--ink)}

  .nextup{margin:14px 20px 0;padding:12px 16px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .nextup .big{font-size:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:8px 16px;cursor:pointer;font-weight:600}
  .nextup .hint{color:var(--muted);font-size:12px}

  /* The graph is the page. Detail and browsing slide over it, so exploring never
     throws you onto a different screen. */
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;
    font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer}
  .ghost:hover{color:var(--ink);border-color:var(--muted)}

  .drawer{position:fixed;top:54px;bottom:0;z-index:30;background:var(--panel);
    display:flex;flex-direction:column;transition:transform .22s ease;box-shadow:var(--shadow)}
  .drawer.left{left:0;width:320px;border-right:1px solid var(--line);transform:translateX(-101%)}
  .drawer.right{right:0;width:min(560px,52vw);border-left:1px solid var(--line);transform:translateX(101%)}
  .drawer.open{transform:none}
  @media (max-width:760px){ .drawer.right{width:100%} .drawer.left{width:86%} }
  .drawer-head{display:flex;align-items:center;gap:8px;padding:12px 14px;
    border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
  .drawer-head .x{margin-left:auto}
  .x{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;
    width:28px;height:28px;border-radius:8px;line-height:1}
  .x:hover{background:var(--pill-hover);color:var(--ink)}
  .x.float{position:absolute;top:10px;right:12px;z-index:6}
  .path{flex:1;overflow-y:auto;padding:10px 8px 50px}
  .focus{flex:1;overflow-y:auto}

  .chapter{margin:0 0 6px}
  .ch-head{display:flex;align-items:baseline;gap:8px;padding:8px 10px 4px}
  .ch-title{font-size:12.5px;font-weight:700;letter-spacing:.2px}
  .ch-count{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .ch-q{color:var(--muted);font-size:11.5px;margin:0 10px 8px;line-height:1.55}

  .quests{display:flex;flex-direction:column;gap:2px}
  .quest{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .quest:hover{background:var(--pill-hover)}
  .quest .num{width:26px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  /* No checkbox: a reference list is not a questionnaire. Selection is shown by
     highlighting the row itself. */
  .quest.ext .num::before{content:'·';color:var(--line)}
  .quest.active{background:var(--accent-soft)}
  .quest.active .name{font-weight:700}
  .quest.active::before{content:'';position:absolute;left:0;width:3px;height:18px;
    border-radius:2px;background:var(--accent)}
  .quest{position:relative}
  .quest .en{color:var(--muted);font-size:10.5px;margin-left:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
  .quest.dim{opacity:.22}

  details.fold{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  details.fold summary{cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none}
  details.fold summary:hover{color:var(--ink)}
  .side-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .spill{border:1px dashed var(--line);background:transparent;border-radius:14px;padding:3px 10px;
    font-size:12px;color:var(--muted);cursor:pointer}
  .spill:hover{background:var(--pill)}
  .spill.done{border-style:solid;color:var(--done)}

  .ex{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px}
  .ex .ex-t{font-size:13px;font-weight:600}
  .ex .ex-kind{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 6px;margin-right:6px}
  .ex .ex-body{font-size:13px;margin:4px 0;white-space:pre-wrap}
  .ex .ans{margin-top:6px}
  .ex .ans>button, .qa button{font-size:12px;border:1px solid var(--line);background:var(--pill);color:var(--ink);
    border-radius:7px;padding:2px 10px;cursor:pointer}
  .ex .ans .ans-body{display:none;font-size:12.5px;color:var(--muted);border-left:3px solid var(--done);
    padding:6px 10px;margin-top:6px;white-space:pre-wrap;background:var(--def-bg);border-radius:0 8px 8px 0}
  .ex .ans.open .ans-body{display:block}

  .card{padding:4px 26px 80px}
  .f-head{position:sticky;top:0;z-index:5;background:var(--panel);
    padding:16px 46px 12px 26px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .f-empty{padding:70px 26px;color:var(--muted);font-size:13.5px}
  .empty{color:var(--muted);font-size:13px}
  .empty h3{color:var(--ink)}
  .f-where{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .f-where .cur{color:var(--accent);font-weight:600}
  .f-where .sep{opacity:.4}
  .f-title{font-size:23px;font-weight:800;margin:6px 0 0;letter-spacing:-.2px;line-height:1.25}
  .f-en{color:var(--muted);font-size:13px;margin:3px 0 0}
  .f-def p{margin:5px 0}
  .f-def p:first-child{margin-top:0}
  .f-def p:last-child{margin-bottom:0}
  .f-def{background:var(--def-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:8px 12px;font-size:13.5px;margin:10px 0}
  .sec{margin-top:26px}
  .sec>h4{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);
    margin:0 0 9px;font-weight:700}
  .sec .txt{font-size:14.5px;line-height:1.78}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{border:1px solid var(--line);background:var(--pill);border-radius:14px;padding:3px 10px;
    font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.5}
  .pill:hover{background:var(--pill-hover)}
  .pill .st{width:8px;height:8px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--muted)}
  .pill.done .st{background:var(--done);border-color:var(--done)}
  .pill .tag{font-size:10px;color:var(--muted)}
  .rel-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;flex-wrap:wrap}
  .rel-tag{flex:0 0 auto;font-size:11px;border-radius:5px;padding:0 6px;line-height:1.7;margin-top:1px;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .rel-body{flex:1;min-width:200px}
  .rel-note{display:block;color:var(--note);font-size:12px}
  .qa{margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:9px}
  .qa .q{font-size:13px;font-weight:600}
  .qa .a{display:none;margin-top:6px;font-size:13px;color:var(--muted)}
  .qa.open .a{display:block}
  .res a{display:block;font-size:13px;margin:2px 0}
  .foot{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
  mark{background:transparent;color:var(--accent);font-weight:700}

  /* ── teaching layer ── */
  .hook{font-size:14px;margin:10px 0;padding:10px 14px;background:var(--def-bg);border-radius:10px;
    border-left:3px solid var(--warn);line-height:1.75}
  .zcard{margin:12px 0;padding:12px 14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft)}
  .zcard .zrow{display:flex;gap:8px;font-size:13.5px;padding:3px 0;align-items:flex-start}
  .zcard .zk{flex:0 0 auto;font-size:11px;color:var(--accent);font-weight:700;border:1px solid var(--accent);
    border-radius:5px;padding:0 6px;line-height:1.8;margin-top:1px}
  .mech{font-size:13.5px;white-space:pre-wrap;line-height:1.8}
  .trap{display:flex;gap:8px;font-size:13px;padding:5px 0;align-items:flex-start}
  .trap .tx{flex:0 0 auto;margin-top:1px}
  .ammo-box{margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--def-bg);border-left:3px solid var(--done)}
  .ammo-box .en{font-size:13.5px;font-style:italic;line-height:1.7}
  .ammo-box .use{font-size:12px;color:var(--muted);margin-top:4px}
  .ch-svg{margin:10px 0 4px}
  .ch-svg svg{max-width:100%;height:auto}

  /* ── ecosystem graph ── */
  #graph-stage{position:relative;height:calc(100vh - 54px);background:var(--bg);overflow:hidden}
  #graph{display:block;width:100%;height:100%;cursor:grab}
  #graph.dragging{cursor:grabbing}
  #graph-legend{position:absolute;left:14px;bottom:14px;background:color-mix(in srgb,var(--panel) 88%,transparent);
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-size:10.5px;line-height:1.7;
    max-width:330px;backdrop-filter:blur(6px)}
  #graph-legend .lg{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #graph-legend .lg.off{opacity:.35}
  #graph-legend .sw{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  @media (max-width:760px){ #graph-legend{grid-template-columns:1fr 1fr 1fr;max-width:none;left:8px;right:8px;bottom:8px} }

  .rel-row{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .rel-row:last-child{border-bottom:0}
  .rel-verb{display:inline-block;min-width:104px;color:var(--muted);font-size:11.5px}
  .rel-note{margin:3px 0 0 104px;font-size:11.5px;color:var(--muted);line-height:1.6}

  .txt table,.mech table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
  .txt th,.txt td,.mech th,.mech td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  .txt th,.mech th{background:var(--pill);font-weight:600}
  .txt ul,.txt ol,.mech ul,.mech ol{margin:6px 0 6px 18px;padding:0}
  .txt li,.mech li{margin:3px 0}
  .txt p,.mech p{margin:6px 0}
  .txt p:first-child,.mech p:first-child{margin-top:0}
  .txt code,.mech code{background:var(--pill);border-radius:4px;padding:1px 4px;font-size:.92em}
  .txt pre,.mech pre{background:var(--pill);border-radius:8px;padding:9px 11px;overflow-x:auto;font-size:11.5px;line-height:1.55}
  .txt blockquote,.mech blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}

  .f-fallback{margin:6px 0 2px;font-size:11.5px;color:var(--muted);
    border-left:3px solid var(--line);padding-left:9px}

  /* nav rail rows: one number, one meaning — position within the chapter */
  .quest .num{width:22px;text-align:right;color:var(--muted);font-size:11px;
    font-variant-numeric:tabular-nums;flex:0 0 auto}
  .quest.ext .num{opacity:.55}
  .quest .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{display:flex;align-items:center;gap:6px;margin:4px 0 2px 10px;padding:4px 8px;
    background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;
    cursor:pointer;border-radius:7px}
  .more:hover{background:var(--pill-hover);color:var(--ink)}
  .more .chev{display:inline-block;transition:transform .15s;font-size:10px}
  .more.open .chev{transform:rotate(180deg)}
  .ext-list{margin-top:2px}
  .f-def{font-size:15px;line-height:1.8;margin:4px 0 0}

  .ch-svg.top{margin:0 0 18px;padding:12px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;overflow-x:auto}
  .ch-svg.top svg{max-width:100%;height:auto;display:block}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>iBrain</h1>
    <span class="tagline" id="tagline"></span>
  </div>
  <button class="ghost" id="browse-btn">按章节阅读</button>
  <div class="seg" id="layers"></div>
</header>

<section id="graph-stage">
  <canvas id="graph"></canvas>
  <div id="graph-legend"></div>
</section>

<aside class="drawer left" id="nav-drawer">
  <div class="drawer-head"><span>按章节阅读</span><button class="x" data-close="nav">✕</button></div>
  <div class="path" id="path"></div>
</aside>

<aside class="drawer right" id="detail-drawer">
  <button class="x float" data-close="detail">✕</button>
  <div class="focus" id="focus"></div>
</aside>

<script>
const DATA = /*__DATA__*/{};

const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const ORDER = DATA.mainOrder;              // id → 1..81
const TOTAL = Object.keys(ORDER).length;
// ── language & scope ─────────────────────────────────────────────────────────
// This is a public reference, not a personal course tracker: nothing here records
// "how far you got". Scope is a filter over the same material, and language swaps
// the whole page rather than printing a second language beside the first.
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const T = {
  tagline: '预测市场知识库',
  definition: '定义', why: '为什么重要', how: '怎么运作', example: '例子',
  misconceptions: '常见误解', practice: '实战里怎么用',
  prereq: '先读这些', unlocks: '读懂它之后', relations: '关联', world: '真实世界',
  recall: '自测', showAnswer: '看答案', hide: '收起',
  exercises: '本章练习', diagram: '机制图', relatedEntities: '关系',
  graph: '知识图谱', concepts: '概念',
  empty: '从左侧选一个概念，或在图谱里点一个节点。',
  more: '展开延伸概念', less: '收起延伸概念',
};
const t_ = k => T[k];
const isCore = id => ORDER[id] !== undefined;
const nameOf = n => !n ? '' : (n.titleZh || n.title);
const subOf = n => { if (!n) return ''; const o = n.title; return o && o !== nameOf(n) ? o : ''; };
const zh = nameOf, en = subOf;

const chapterOf = {};
DATA.chapters.forEach(ch => {
  ch.concepts.forEach(c => chapterOf[c] = ch);
  ch.side.forEach(c => chapterOf[c] = ch);
});

// relations index (single-side storage → both directions)
const relFwd = new Map(), relRev = new Map();
const preOf = new Map(), unlockOf = new Map();
for (const n of DATA.nodes) {
  if (n.type !== 'concept') continue;
  preOf.set(n.id, n.prerequisites || []);
  for (const p of n.prerequisites || []) {
    if (!unlockOf.has(p)) unlockOf.set(p, []);
    unlockOf.get(p).push(n.id);
  }
  for (const r of n.relations || []) {
    if (!relFwd.has(n.id)) relFwd.set(n.id, []);
    relFwd.get(n.id).push(r);
    if (!relRev.has(r.target)) relRev.set(r.target, []);
    relRev.get(r.target).push({source: n.id, rel: r.rel, note: r.note});
  }
}
const REL_ZH = {'contrasts-with':'对照','special-case-of':'特例','component-of':'组成',
  'mechanism-of':'机制','risk-of':'风险','mitigated-by':'缓解','measured-by':'度量',
  'instantiated-by':'实例','see-also':'另见','':'相关'};
const REL_ORDER = ['contrasts-with','special-case-of','component-of','mechanism-of','risk-of','mitigated-by','measured-by','see-also',''];
const FWD_TEXT = {'contrasts-with':['和','对照着学'],'special-case-of':['是','的特例'],
  'component-of':['是','的组成部分'],'mechanism-of':['是','的机制'],'risk-of':['是','承载的风险'],
  'mitigated-by':['由','缓解'],'measured-by':['由','度量'],'see-also':['',''],'':['','']};
const REV_TEXT = {'contrasts-with':['和','对照着学'],'special-case-of':['','是它的特例'],
  'component-of':['','是它的组成部分'],'mechanism-of':['','是它的机制'],'risk-of':['','是它承载的风险'],
  'mitigated-by':['它能缓解',''],'measured-by':['它度量',''],'see-also':['',''],'':['','']};

const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typeZh = t => ({'exchange-venue':'venue','market-maker-fund':'做市/基金','organization':'公司',
  'protocol-network':'协议/链','regulator':'监管','jurisdiction':'法域','person':'人物'})[t] || '';

// ── minimal markdown → html ──────────────────────────────────────────────────
// The notes are written in markdown; rendering them as plain text turns emphasis
// into literal asterisks and tables into pipe soup. Escape first, then re-introduce
// only the handful of constructs the notes actually use.
function mdInline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\w)_([^_]+)_(?!\w)/g, '<em>$1</em>');
}
function md(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    // table
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${mdInline(c)}</th>`).join('') +
               '</tr></thead><tbody>' +
               rows.map(r => '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') +
               '</tbody></table>');
      continue;
    }
    // fenced block
    if (/^```/.test(line)) {
      i++; const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
      continue;
    }
    // list
    if (/^\s*(?:[-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*(?:[-*]|\d+\.)\s+/.test(lines[i]))
        items.push(lines[i++].replace(/^\s*(?:[-*]|\d+\.)\s+/, ''));
      out.push(`<${ordered ? 'ol' : 'ul'}>` + items.map(x => `<li>${mdInline(x)}</li>`).join('') +
               `</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }
    // blockquote
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${mdInline(buf.join(' '))}</blockquote>`);
      continue;
    }
    // always consume at least one line: a '|' line that is not a real table would
    // otherwise match none of the branches above and spin here forever
    const buf = [lines[i++]];
    while (i < lines.length && lines[i].trim() && !/^\s*(?:[-*]|\d+\.|\||>|```)/.test(lines[i]))
      buf.push(lines[i++]);
    out.push(`<p>${mdInline(buf.join(' '))}</p>`);
  }
  return out.join('');
}

// ── knowledge graph ──────────────────────────────────────────────────────────
// The whole vault, not a slice of it: every note and every edge. Concepts are
// grouped by domain, entities by kind, and each group's name is drawn over its
// own region so the shape of the library is readable at a glance.
const ENTITY_TYPES = new Set(DATA.entityTypes || []);

const GROUPS = [
  ['d:market-microstructure',        '市场微观结构', '#4FA3E3'],
  ['d:financial-markets',            '金融市场',     '#54C7C0'],
  ['d:derivatives',                  '衍生品',       '#E0894A'],
  ['d:institutional-risk',           '机构风险',     '#E05C63'],
  ['d:prediction-outcome-markets',   '事件与结果市场', '#DE6BAA'],
  ['d:crypto-market-structure',      '加密市场结构', '#8C7AE0'],
  ['d:blockchain',                   '区块链',       '#6FBF73'],
  ['d:industry-strategy',            '行业结构',     '#C9A227'],
  ['d:exchanges',                    '交易场所',     '#3FA890'],
  ['d:stablecoins-wallets-payments', '稳定币与支付', '#8FBF5E'],
  ['d:regulation-compliance',        '监管合规',     '#C4626E'],
  ['t:person',                       '人物',         '#F2A0C0'],
  ['t:exchange-venue',               '交易场馆',     '#6EA8DC'],
  ['t:organization',                 '公司与机构',   '#E8A55C'],
  ['t:market-maker-fund',            '做市商与基金', '#5FBFA0'],
  ['t:protocol-network',             '协议与链',     '#A08CE8'],
  ['t:regulator',                    '监管机构',     '#E07070'],
  ['t:jurisdiction',                 '法域',         '#9AA5B1'],
  ['x:case',                         '真实案例',     '#D8CE6A'],
];
const GROUP_LABEL = Object.fromEntries(GROUPS.map(g => [g[0], g[1]]));
const GROUP_COLOR = Object.fromEntries(GROUPS.map(g => [g[0], g[2]]));

// Apparatus — source notes, indexes, MOCs, course files, flashcards, dashboards,
// the policy and taxonomy — is *about* the knowledge, not the knowledge. It has no
// place on a map of the subject.
const APPARATUS = new Set(['source', 'research-report', 'report', 'book-course', 'moc',
  'dashboard', 'lesson', 'flashcard-deck', 'curriculum', 'policy', 'taxonomy',
  'relationship', 'original']);

// Layers, coarse to fine. Entities are the world, tier-1 concepts are the spine,
// tier-2 concepts are detail you opt into — not every concept needs to be a pin.
const LAYERS = [
  ['world',  '生态'],
  ['spine',  '生态 + 核心概念'],
  ['all',    '全部'],
];
let LAYER = store.get('ibrain.layer', 'spine');

function layerOf(n) {
  if (APPARATUS.has(n.type)) return null;
  if (n.type === 'concept') return n.importance === 'tier-1' ? 'spine' : 'all';
  return 'world';                                   // entities and cases
}
function inLayer(n) {
  const l = layerOf(n);
  if (!l) return false;
  if (LAYER === 'world') return l === 'world';
  if (LAYER === 'spine') return l === 'world' || l === 'spine';
  return true;
}

function groupOf(n) {
  if (n.type === 'concept') {
    const d = (n.domains || [])[0];
    return GROUP_COLOR['d:' + d] ? 'd:' + d : 'd:industry-strategy';
  }
  if (n.type === 'case-study') return 'x:case';
  if (ENTITY_TYPES.has(n.type)) return GROUP_COLOR['t:' + n.type] ? 't:' + n.type : 't:organization';
  return 't:organization';
}

const REL_LABEL = {
  'founded':'创立','co-founded':'共同创立','executive-of':'现任高管',
  'former-executive-of':'前高管','advises':'顾问','alumnus-of':'共同履历',
  'invested-in':'投资','backed-by':'获投','acquired':'收购','partners-with':'合作',
  'integrates-with':'集成','competes-with':'竞争','provides-liquidity-to':'做市',
  'provides-infrastructure-to':'基础设施','built-on':'构建于','settles-on':'结算于',
  'regulated-by':'受监管','distributes':'分发','depends-on':'依赖','spun-out-of':'分拆自',
  'special-case-of':'特例','component-of':'组成','mechanism-of':'机制','risk-of':'风险面',
  'mitigated-by':'缓解','measured-by':'度量','contrasts-with':'对照','instantiated-by':'实例',
  'see-also':'另见',
};
const KIND_LABEL = {prereq: '前置', crel: '', erel: '', typed: '', link: '提及'};

let G = null;
let hiddenGroups = new Set();

function buildGraph() {
  const ns = DATA.nodes.filter(n => layerOf(n) !== null);
  const idx = new Map(ns.map((n, i) => [n.id, i]));
  const links = [];
  const seen = new Set();
  for (const e of DATA.edges) {
    if (!idx.has(e.source) || !idx.has(e.target) || e.source === e.target) continue;
    const key = [e.source, e.target].sort().join('|') + '|' + (e.relType || e.kind);
    if (seen.has(key)) continue;
    seen.add(key);
    links.push({s: idx.get(e.source), t: idx.get(e.target), kind: e.kind,
                rel: e.relType || '', note: e.note || ''});
  }
  const deg = new Array(ns.length).fill(0);
  for (const l of links) { deg[l.s]++; deg[l.t]++; }

  // Seed each node inside its own group's region. Starting from a global spiral
  // meant the groups began interleaved and the simulation cooled before they
  // could ever separate.
  const groupOfNode = ns.map(groupOf);
  const present = GROUPS.map(g => g[0]).filter(k => groupOfNode.includes(k));
  const anchors = {};
  present.forEach((k, i) => {
    const a = (i / present.length) * Math.PI * 2 - Math.PI / 2;
    anchors[k] = {x: Math.cos(a) * 760, y: Math.sin(a) * 520};
  });
  const seenInGroup = {};
  const nodes = ns.map((n, i) => {
    const g = groupOfNode[i];
    const an = anchors[g] || {x: 0, y: 0};
    const j = (seenInGroup[g] = (seenInGroup[g] || 0) + 1);
    const a = j * 2.399963, R = 13 * Math.sqrt(j);
    const isConcept = n.type === 'concept';
    const rad = (isConcept ? 2.2 : 3.4) + Math.pow(deg[i], isConcept ? 0.48 : 0.62) * (isConcept ? 1.5 : 2.3);
    return {id: n.id, type: n.type, node: n, deg: deg[i], g,
            x: an.x + Math.cos(a) * R, y: an.y + Math.sin(a) * R,
            vx: 0, vy: 0, r: Math.min(rad, 16), fixed: false};
  });
  return {nodes, links, anchors, alpha: 1};
}

const visible = n => !hiddenGroups.has(n.g) && inLayer(n.node);

function tick() {
  const {nodes, links, anchors} = G;
  const a = G.alpha;
  for (let i = 0; i < nodes.length; i++) {
    const p = nodes[i];
    if (!visible(p)) continue;
    for (let j = i + 1; j < nodes.length; j++) {
      const q = nodes[j];
      if (!visible(q)) continue;
      let dx = q.x - p.x, dy = q.y - p.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 90000) continue;
      if (d2 < 1) { d2 = 1; dx = (i % 3) - 1; dy = (j % 3) - 1; }
      const f = 900 / d2, d = Math.sqrt(d2);
      const fx = dx / d * f, fy = dy / d * f;
      p.vx -= fx; p.vy -= fy; q.vx += fx; q.vy += fy;
    }
  }
  for (const l of links) {
    const p = nodes[l.s], q = nodes[l.t];
    if (!visible(p) || !visible(q)) continue;
    const dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    // same group pulls tight, across groups only tethers — this is what turns a
    // hairball into readable regions joined by visible bridges
    const same = p.g === q.g;
    const f = (d - (same ? 34 : 150)) * (same ? 0.030 : 0.0035);
    const fx = dx / d * f, fy = dy / d * f;
    p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
  }
  for (const p of nodes) {
    if (!visible(p)) continue;
    const an = anchors[p.g];
    if (an) { p.vx += (an.x - p.x) * 0.020; p.vy += (an.y - p.y) * 0.020; }
    p.vx -= p.x * 0.0016; p.vy -= p.y * 0.0016;
    if (p.fixed) { p.vx = p.vy = 0; continue; }
    const sp = Math.hypot(p.vx, p.vy), CAP = 16;
    if (sp > CAP) { p.vx = p.vx / sp * CAP; p.vy = p.vy / sp * CAP; }
    p.x += p.vx * a; p.y += p.vy * a;
    p.vx *= 0.80; p.vy *= 0.80;
  }
  G.alpha = Math.max(0.10, G.alpha * 0.997);
}

const view = {k: 1, x: 0, y: 0};
let hoverNode = null, dragNode = null, panning = false, last = null;

function groupCentroids() {
  const acc = {};
  for (const p of G.nodes) {
    if (!visible(p)) continue;
    (acc[p.g] = acc[p.g] || {x: 0, y: 0, n: 0});
    acc[p.g].x += p.x; acc[p.g].y += p.y; acc[p.g].n++;
  }
  return acc;
}

function drawGraph() {
  const cv = document.getElementById('graph');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2 + view.x, h / 2 + view.y);
  ctx.scale(view.k, view.k);

  const {nodes, links} = G;
  const near = new Set();
  if (hoverNode) {
    near.add(hoverNode);
    for (const l of links) {
      if (nodes[l.s] === hoverNode) near.add(nodes[l.t]);
      if (nodes[l.t] === hoverNode) near.add(nodes[l.s]);
    }
  }

  // group names sit behind everything, like map labels over a region
  if (!hoverNode) {
    const cen = groupCentroids();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const boxes = [];
    for (const [g, c] of Object.entries(cen).sort((a, b) => b[1].n - a[1].n)) {
      if (c.n < 3) continue;
      const size = Math.min(40, 16 + c.n * 0.55) / view.k;
      ctx.font = `700 ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif`;
      const label = GROUP_LABEL[g];
      const x = c.x / c.n, y = c.y / c.n;
      const w = ctx.measureText(label).width, hh = size;
      const b = {x0: x - w / 2, x1: x + w / 2, y0: y - hh / 2, y1: y + hh / 2};
      // a region name that lands on another one names neither region
      if (boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0)) continue;
      boxes.push(b);
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = GROUP_COLOR[g];
      ctx.fillText(label, x, y);
    }
  }

  for (const l of links) {
    const p = nodes[l.s], q = nodes[l.t];
    if (!visible(p) || !visible(q)) continue;
    const lit = hoverNode && (p === hoverNode || q === hoverNode);
    ctx.strokeStyle = lit ? GROUP_COLOR[hoverNode.g] : '#8a97a8';
    ctx.globalAlpha = lit ? 0.8 : (hoverNode ? 0.03 : 0.11);
    ctx.lineWidth = (lit ? 1.4 : 0.55) / view.k;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }

  for (const p of nodes) {
    if (!visible(p)) continue;
    ctx.globalAlpha = hoverNode && !near.has(p) ? 0.10 : 1;
    ctx.fillStyle = GROUP_COLOR[p.g] || '#888';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    if (p === hoverNode) {
      ctx.strokeStyle = GROUP_COLOR[p.g]; ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2.5 / view.k;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4 / view.k, 0, 6.2832); ctx.stroke();
    }
  }

  // edge verbs on the hovered node's own links
  if (hoverNode) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${10 / view.k}px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif`;
    for (const l of links) {
      const p = nodes[l.s], q = nodes[l.t];
      if ((p !== hoverNode && q !== hoverNode) || !visible(p) || !visible(q)) continue;
      const verb = REL_LABEL[l.rel] || KIND_LABEL[l.kind] || '';
      if (!verb) continue;
      const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      const bw = ctx.measureText(verb).width + 8 / view.k;
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--panel').trim() || '#fff';
      ctx.fillRect(mx - bw / 2, my - 7 / view.k, bw, 14 / view.k);
      ctx.fillStyle = GROUP_COLOR[hoverNode.g];
      ctx.fillText(verb, mx, my);
    }
  }

  // node names: hubs always, neighbours on hover, everything when zoomed in
  const ink = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#222';
  const fs = 10.5 / view.k;
  ctx.font = `${fs}px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const showAll = view.k > 1.9;
  const placed = [];
  const wants = nodes.filter(p => visible(p) &&
      ((hoverNode && near.has(p)) || showAll || p.deg >= 16))
    .sort((x, y) => (near.has(y) - near.has(x)) || (y.deg - x.deg));
  for (const p of wants) {
    const txt = nameOf(p.node);
    const tw = ctx.measureText(txt).width, x = p.x, y = p.y + p.r + 2.5 / view.k;
    const box = {x0: x - tw / 2, x1: x + tw / 2, y0: y, y1: y + fs};
    if (placed.some(q => box.x0 < q.x1 && box.x1 > q.x0 && box.y0 < q.y1 && box.y1 > q.y0)) continue;
    placed.push(box);
    ctx.globalAlpha = hoverNode && !near.has(p) ? 0.14 : 0.9;
    ctx.fillStyle = ink;
    ctx.fillText(txt, x, y);
  }
  ctx.restore();
}

function fitGraph() {
  const cv = document.getElementById('graph');
  const w = cv.clientWidth, h = cv.clientHeight;
  const vis = G.nodes.filter(visible);
  if (!vis.length || !w) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of vis) {
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  const pad = 56;
  view.k = Math.min(1.6, Math.max(0.22,
    Math.min((w - pad * 2) / Math.max(1, x1 - x0), (h - pad * 2) / Math.max(1, y1 - y0))));
  view.x = -((x0 + x1) / 2) * view.k;
  view.y = -((y0 + y1) / 2) * view.k;
}

let settleTicks = 0;
function graphLoop() {
  if (document.getElementById('graph-stage').style.display === 'none') return;
  tick();
  if (++settleTicks < 300 && settleTicks % 15 === 0 && !dragNode && !panning) fitGraph();
  drawGraph();
  requestAnimationFrame(graphLoop);
}

function toWorld(ev) {
  const cv = document.getElementById('graph'), b = cv.getBoundingClientRect();
  return {x: (ev.clientX - b.left - b.width / 2 - view.x) / view.k,
          y: (ev.clientY - b.top - b.height / 2 - view.y) / view.k};
}
function pick(pt) {
  let best = null, bd = 14 / view.k;
  for (const p of G.nodes) {
    if (!visible(p)) continue;
    const d = Math.hypot(p.x - pt.x, p.y - pt.y);
    if (d < Math.max(p.r + 4, bd) && (!best || d < bd)) { best = p; bd = d; }
  }
  return best;
}

function wireGraph() {
  const cv = document.getElementById('graph');
  cv.onmousemove = ev => {
    const pt = toWorld(ev);
    if (dragNode) { dragNode.x = pt.x; dragNode.y = pt.y; G.alpha = Math.max(G.alpha, 0.3); return; }
    if (panning && last) { view.x += ev.clientX - last.x; view.y += ev.clientY - last.y; last = {x: ev.clientX, y: ev.clientY}; return; }
    hoverNode = pick(pt);
    cv.style.cursor = hoverNode ? 'pointer' : 'grab';
  };
  cv.onmousedown = ev => {
    const p = pick(toWorld(ev));
    if (p) { dragNode = p; p.fixed = true; }
    else { panning = true; last = {x: ev.clientX, y: ev.clientY}; cv.classList.add('dragging'); }
  };
  window.addEventListener('mouseup', () => {
    if (dragNode) dragNode.fixed = false;
    dragNode = null; panning = false; last = null;
    document.getElementById('graph').classList.remove('dragging');
  });
  cv.onclick = ev => {
    const p = pick(toWorld(ev));
    if (p) { pinnedId = p.id; focusOn(p.id); openDrawer('detail'); }
    else closeDrawer('detail');
  };
  cv.onwheel = ev => {
    ev.preventDefault();
    view.k = Math.min(5, Math.max(0.18, view.k * (ev.deltaY < 0 ? 1.12 : 0.89)));
  };
}

function renderLegend() {
  const box = document.getElementById('graph-legend');
  box.innerHTML = '';
  const counts = {};
  for (const p of G.nodes) counts[p.g] = (counts[p.g] || 0) + 1;
  for (const [key, label, color] of GROUPS) {
    if (!counts[key]) continue;
    const row = el('div', 'lg' + (hiddenGroups.has(key) ? ' off' : ''));
    const sw = el('span', 'sw'); sw.style.background = color;
    row.appendChild(sw);
    row.appendChild(el('span', '', `${label} · ${counts[key]}`));
    row.onclick = () => {
      hiddenGroups.has(key) ? hiddenGroups.delete(key) : hiddenGroups.add(key);
      G.alpha = 0.6; settleTicks = 0; renderLegend();
    };
    box.appendChild(row);
  }
}

// ── top bar ──────────────────────────────────────────────────────────────────
// ── drawers ──────────────────────────────────────────────────────────────────
// Clicking a node used to throw you onto a different screen. Now the map stays
// put and detail slides in beside it, so one click never loses your place.
function openDrawer(which) {
  document.getElementById(which === 'nav' ? 'nav-drawer' : 'detail-drawer').classList.add('open');
}
function closeDrawer(which) {
  document.getElementById(which === 'nav' ? 'nav-drawer' : 'detail-drawer').classList.remove('open');
  if (which === 'detail') { pinnedId = null; }
}
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => closeDrawer(b.dataset.close);
});
document.getElementById('browse-btn').onclick = () => {
  const nav = document.getElementById('nav-drawer');
  if (nav.classList.contains('open')) { closeDrawer('nav'); return; }
  openDrawer('nav');
  // a browser that opens on nothing is a dead end: land on the first entry
  if (!pinnedId) {
    const first = (DATA.chapters[0] || {}).concepts || [];
    if (first.length) { pinnedId = first[0]; focusOn(first[0]); }
  }
  openDrawer('detail');
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer('detail'); closeDrawer('nav'); }
});

let pinnedId = null;

function segButton(container, key, label, active, onPick) {
  const b = el('button', active ? 'on' : '', label);
  b.onclick = () => onPick(key);
  container.appendChild(b);
}

function renderTopBar() {
  document.getElementById('tagline').textContent = t_('tagline');
  const sel = document.getElementById('layers');
  sel.innerHTML = '';
  for (const [k, lbl] of LAYERS)
    segButton(sel, k, lbl, LAYER === k, k => {
      LAYER = k; store.set('ibrain.layer', k);
      G.alpha = 0.85; settleTicks = 0;
      renderTopBar(); renderLegend();
    });
}

// ── chapters ─────────────────────────────────────────────────────────────────
// One numbering scheme, one meaning: position within the chapter. Extended
// concepts continue the same count rather than sitting numberless beside it.
// Chapter diagrams and exercises live in the reading pane, not the nav rail.
const CH_POS = {};                     // concept id → "chapter.index"
const CH_INDEX = {};                   // concept id → index within its chapter
DATA.chapters.forEach(ch => {
  [...ch.concepts, ...ch.side].forEach((cid, i) => {
    CH_INDEX[cid] = i + 1;
    CH_POS[cid] = `${ch.n}.${i + 1}`;
  });
});
const expanded = new Set();

function renderPath() {
  const main = document.getElementById('path');
  main.innerHTML = '';
  for (const ch of DATA.chapters) {
    const sec = el('section', 'chapter');
    sec.dataset.ch = ch.n;
    const head = el('div', 'ch-head');
    head.appendChild(el('span', 'ch-title', esc(ch.title)));
    head.appendChild(el('span', 'ch-count', `${ch.concepts.length + ch.side.length} 个概念`));
    sec.appendChild(head);
    if (ch.question) sec.appendChild(el('div', 'ch-q', esc(ch.question)));

    const list = el('div', 'quests');
    const row = cid => {
      const n = byId.get(cid);
      if (!n) return null;
      const q = el('div', 'quest' + (isCore(cid) ? '' : ' ext'));
      q.dataset.id = cid;
      q.appendChild(el('span', 'num', String(CH_INDEX[cid])));
      q.appendChild(el('span', 'name', esc(nameOf(n))));
      if (subOf(n)) q.appendChild(el('span', 'en', esc(subOf(n))));
      q.onclick = () => { pinnedId = cid; focusOn(cid); openDrawer('detail'); };
      return q;
    };
    for (const cid of ch.concepts) { const r = row(cid); if (r) list.appendChild(r); }
    sec.appendChild(list);

    if (ch.side.length) {
      const extra = el('div', 'quests ext-list');
      for (const cid of ch.side) { const r = row(cid); if (r) extra.appendChild(r); }
      const open = expanded.has(ch.n);
      extra.style.display = open ? '' : 'none';
      const btn = el('button', 'more' + (open ? ' open' : ''),
        `<span class="chev">▾</span>${open ? t_('less') : t_('more')} (${ch.side.length})`);
      btn.onclick = () => {
        expanded.has(ch.n) ? expanded.delete(ch.n) : expanded.add(ch.n);
        renderPath();
      };
      sec.appendChild(btn);
      sec.appendChild(extra);
    }
    main.appendChild(sec);
  }
}

// Chapter-level material (mechanism diagram, exercises) belongs in the reading
// pane with the concept, not stacked into the navigation rail.
function chapterDiagram(ch) {
  if (!ch || !ch.svg) return null;
  const box = el('div', 'ch-svg top');
  box.innerHTML = ch.svg;   // build-time trusted asset
  return box;
}

function chapterExtras(ch) {
  const frag = document.createDocumentFragment();
  if (ch.exercises && ch.exercises.length) {
    const d = el('details', 'fold');
    d.appendChild(el('summary', '', `${t_('exercises')} ×${ch.exercises.length}`));
    for (const ex of ch.exercises) {
      const box = el('div', 'ex');
      box.appendChild(el('div', 'ex-t', `<span class="ex-kind">${esc(ex.kind)}</span>${esc(ex.title)}`));
      if (ex.body) box.appendChild(el('div', 'ex-body', esc(ex.body)));
      if (ex.answer) {
        const ans = el('div', 'ans');
        const b = el('button', '', t_('showAnswer'));
        b.onclick = () => { ans.classList.toggle('open'); b.textContent = ans.classList.contains('open') ? t_('hide') : t_('showAnswer'); };
        ans.appendChild(b);
        ans.appendChild(el('div', 'ans-body', esc(ex.answer)));
        box.appendChild(ans);
      }
      d.appendChild(box);
    }
    frag.appendChild(d);
  }
  return frag;
}

// ── focus detail (everything inline) ──
function pillFor(id) {
  const n = byId.get(id);
  if (!n) return el('span');
  const isConcept = n.type === 'concept';
  const p = el('span', 'pill');
  if (isConcept) p.appendChild(el('span', 'st'));
  p.appendChild(el('span', '', esc(zh(n))));
  if (!isConcept) p.appendChild(el('span', 'tag', esc(typeZh(n.type))));
  else if (!ORDER[id]) p.appendChild(el('span', 'tag', '支线'));
  if (isConcept) p.onclick = () => focusOn(id);
  else p.title = n.title;
  return p;
}
function relRow(tag, parts, note, pid) {
  const row = el('div', 'rel-row');
  row.appendChild(el('span', 'rel-tag', esc(REL_ZH[tag] ?? tag)));
  const body = el('span', 'rel-body');
  if (parts[0]) body.appendChild(document.createTextNode(parts[0] + ' '));
  body.appendChild(pillFor(pid));
  if (parts[1]) body.appendChild(document.createTextNode(' ' + parts[1]));
  if (note) body.appendChild(el('span', 'rel-note', esc(note)));
  row.appendChild(body);
  return row;
}

function focusEntity(id) {
  const n = byId.get(id);
  const box = document.getElementById('focus');
  box.innerHTML = '';
  const head = el('div', 'f-head');
  const inner = el('div', 'inner');
  inner.appendChild(el('div', 'f-where', `<span class="cur">${esc(GROUP_LABEL[groupOf(n)] || n.type)}</span>`));
  inner.appendChild(el('h1', 'f-title', esc(nameOf(n))));
  if (subOf(n)) inner.appendChild(el('div', 'f-en', esc(subOf(n))));
  head.appendChild(inner);
  box.appendChild(head);
  const card = el('div', 'card');
  if (n.summary) {
    const s = el('section', 'f-sec');
    s.appendChild(el('div', 'mech', md(n.summary)));
    card.appendChild(s);
  }
  // both directions: what this entity does, and what is done to it
  const out = [], inn = [];
  for (const e of DATA.edges) {
    if (!e.relType) continue;
    if (e.source === id && byId.has(e.target)) out.push(e);
    else if (e.target === id && byId.has(e.source)) inn.push(e);
  }
  if (out.length || inn.length) {
    const s = el('section', 'f-sec');
    s.appendChild(el('h4', '', t_('relatedEntities')));
    const line = (other, verb, note, forward) => {
      const row = el('div', 'rel-row');
      const vb = REL_LABEL[verb] || verb;
      row.appendChild(el('span', 'rel-verb', esc(forward ? vb : '← ' + vb)));
      const pill = pillFor(other);
      if (pill) row.appendChild(pill);
      if (note) row.appendChild(el('div', 'rel-note', esc(note)));
      return row;
    };
    for (const e of out) s.appendChild(line(e.target, e.relType, e.note, true));
    for (const e of inn) s.appendChild(line(e.source, e.relType, e.note, false));
    card.appendChild(s);
  }
  box.appendChild(card);
  box.scrollTop = 0;
}

function focusOn(id, push = true) {
  const n = byId.get(id);
  if (!n) return;
  if (n.type !== 'concept') { if (push) history.replaceState(null, '', '#' + id); focusEntity(id); return; }
  if (push) history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.quest.active').forEach(q => q.classList.remove('active'));
  const row = document.querySelector(`.quest[data-id="${CSS.escape(id)}"]`);
  if (row) { row.classList.add('active'); row.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }

  const box = document.getElementById('focus');
  box.innerHTML = '';
  const card = el('div', 'card');
  const ch = chapterOf[id];

  // One position label, one meaning: which chapter, and which entry within it.
  const head = el('div', 'f-head');
  const inner = el('div', 'inner');
  inner.appendChild(el('div', 'f-where',
    `<span class="cur">${esc(ch ? ch.title : '')}</span>` +
    `<span class="sep">·</span><span>第 ${CH_INDEX[id]} 条 / 共 ${ch ? ch.concepts.length + ch.side.length : '?'} 条</span>`));
  inner.appendChild(el('h1', 'f-title', esc(nameOf(n))));
  if (subOf(n)) inner.appendChild(el('div', 'f-en', esc(subOf(n))));
  head.appendChild(inner);
  box.appendChild(head);

  const diagram = chapterDiagram(ch);
  if (diagram) card.appendChild(diagram);

  const content = n.content || {};
  const addTxt = (title, txt) => {
    if (!txt) return;
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', title));
    s.appendChild(el('div', 'txt', md(txt)));
    card.appendChild(s);
  };
  const bullets = txt => (txt || '').split('\n').map(l => l.replace(/^- /, '').trim()).filter(Boolean);

  if (n.definition) card.appendChild(el('div', 'f-def', md(n.definition)));
  addTxt(t_('why'), content.why);
  addTxt(t_('how'), content.how);
  addTxt(t_('example'), content.example);
  addTxt(t_('misconceptions'), content.misconceptions);
  addTxt(t_('practice'), content.practice);

  const pres = preOf.get(id) || [];
  if (pres.length) {
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', '⬆ 先懂这些'));
    const pills = el('div', 'pills');
    pres.forEach(p => pills.appendChild(pillFor(p)));
    s.appendChild(pills);
    card.appendChild(s);
  }
  const unlocks = (unlockOf.get(id) || []).filter(u => ORDER[u])
    .sort((a, b) => ORDER[a] - ORDER[b]);
  if (unlocks.length) {
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', '⬇ 懂它之后解锁'));
    const pills = el('div', 'pills');
    unlocks.forEach(u => pills.appendChild(pillFor(u)));
    s.appendChild(pills);
    card.appendChild(s);
  }

  const rows = [];
  for (const r of relFwd.get(id) || []) {
    if (r.rel === 'instantiated-by') continue;
    rows.push({tag: r.rel, o: REL_ORDER.indexOf(r.rel), parts: FWD_TEXT[r.rel] || FWD_TEXT[''], note: r.note, pid: r.target, rev: 0});
  }
  for (const r of relRev.get(id) || []) {
    if (r.rel === 'instantiated-by') continue;
    rows.push({tag: r.rel, o: REL_ORDER.indexOf(r.rel), parts: REV_TEXT[r.rel] || REV_TEXT[''], note: r.note, pid: r.source, rev: 1});
  }
  rows.sort((a, b) => (a.o - b.o) || (a.rev - b.rev));
  if (rows.length) {
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', '🔗 关联'));
    rows.forEach(r => s.appendChild(relRow(r.tag, r.parts, r.note, r.pid)));
    card.appendChild(s);
  }

  const inst = (relFwd.get(id) || []).filter(r => r.rel === 'instantiated-by');
  if (inst.length) {
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', '🌍 真实世界'));
    for (const r of inst) {
      const row = el('div', 'rel-row');
      row.appendChild(el('span', 'rel-tag', '实例'));
      const body = el('span', 'rel-body');
      body.appendChild(pillFor(r.target));
      if (r.note) body.appendChild(el('span', 'rel-note', esc(r.note)));
      row.appendChild(body);
      s.appendChild(row);
    }
    card.appendChild(s);
  }

  if ((content.recall || []).length) {
    const s = el('div', 'sec');
    s.appendChild(el('h4', '', '🗣 盲答'));
    for (const qa of content.recall) {
      const q = el('div', 'qa');
      q.appendChild(el('div', 'q', esc(qa.q)));
      const b = el('button', '', '看答案');
      const a = el('div', 'a', esc(qa.a));
      b.onclick = () => { q.classList.toggle('open'); b.textContent = q.classList.contains('open') ? '收起' : '看答案'; };
      q.appendChild(b); q.appendChild(a);
      s.appendChild(q);
    }
    card.appendChild(s);
  }

  if ((n.resources || []).length) {
    const s = el('div', 'sec res');
    s.appendChild(el('h4', '', '📎 原始资源'));
    for (const r of n.resources) {
      const a = el('a', '', '↗ ' + esc(r.title));
      a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
      s.appendChild(a);
    }
    card.appendChild(s);
  }

  if (ch) card.appendChild(chapterExtras(ch));

  box.appendChild(card);
  box.scrollTop = 0;
}

function renderEmptyFocus() {
  const box = document.getElementById('focus');
  box.innerHTML = '';
  box.appendChild(el('div', 'f-empty', esc(t_('empty'))));
}

G = buildGraph();
wireGraph();
renderTopBar();
renderLegend();
renderPath();
requestAnimationFrame(graphLoop);

const initial = location.hash.slice(1);
if (initial && byId.has(initial)) { pinnedId = initial; focusOn(initial, false); openDrawer('detail'); }
window.addEventListener('resize', drawGraph);
</script>
</body>
