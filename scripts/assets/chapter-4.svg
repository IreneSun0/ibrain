<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">
  <defs><marker id="ar4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker></defs>
  <text x="10" y="18" fill="var(--muted)" font-size="11">稳定币结算轨 — 钱怎么进事件市场, ⚠ = 谁能按暂停键</text>
  <g text-anchor="middle">
    <rect x="10" y="60" width="120" height="50" rx="9" fill="var(--pill)" stroke="var(--line)"/>
    <text x="70" y="81" fill="var(--ink)" font-weight="700">法币 $</text>
    <text x="70" y="98" fill="var(--muted)" font-size="10.5">银行体系 ⚠</text>
    <rect x="180" y="60" width="140" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)"/>
    <text x="250" y="81" fill="var(--ink)" font-weight="700">发行方</text>
    <text x="250" y="98" fill="var(--muted)" font-size="10.5">Tether / Circle ⚠可冻结地址</text>
    <rect x="370" y="60" width="130" height="50" rx="9" fill="var(--pill)" stroke="var(--line)"/>
    <text x="435" y="81" fill="var(--ink)" font-weight="700">公链轨道</text>
    <text x="435" y="98" fill="var(--muted)" font-size="10.5">TRON / Polygon · 24/7</text>
    <rect x="550" y="35" width="160" height="44" rx="9" fill="var(--done-soft)" stroke="var(--done)"/>
    <text x="630" y="53" fill="var(--ink)" font-weight="700">事件市场合约</text>
    <text x="630" y="70" fill="var(--muted)" font-size="10.5">USDC 全额抵押锁定</text>
    <rect x="550" y="95" width="160" height="44" rx="9" fill="var(--pill)" stroke="var(--line)"/>
    <text x="630" y="113" fill="var(--ink)" font-weight="700">交易所 / OTC / MM</text>
    <text x="630" y="130" fill="var(--muted)" font-size="10.5">机构资金池 ⚠平台层</text>
  </g>
  <g stroke="var(--muted)" marker-end="url(#ar4)">
    <line x1="130" y1="85" x2="176" y2="85"/><line x1="320" y1="85" x2="366" y2="85"/>
    <line x1="500" y1="75" x2="546" y2="60"/><line x1="500" y1="95" x2="546" y2="112"/>
  </g>
  <g font-size="10.5" fill="var(--muted)">
    <text x="10" y="170">冻结点没有消失, 只是换了位置: 银行 (账户层) → 发行方 (资产层) → 平台 (托管层) — 链的网络层无人能冻。</text>
    <text x="10" y="190">机构四问: 多快到账 / 何时开门 / 跨境可达 / 谁能暂停 — 事件市场选稳定币轨, 因为选举不在银行营业时间发生。</text>
  </g>
</svg>
