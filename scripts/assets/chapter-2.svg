<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">
  <text x="10" y="18" fill="var(--muted)" font-size="11">左: 事件合约的支付形状 (= binary option) · 右: 两种安全哲学</text>
  <!-- payoff diagram -->
  <g>
    <line x1="50" y1="170" x2="320" y2="170" stroke="var(--muted)"/>
    <line x1="50" y1="170" x2="50" y2="50" stroke="var(--muted)"/>
    <text x="325" y="174" fill="var(--muted)" font-size="10.5">事件</text>
    <text x="20" y="55" fill="var(--muted)" font-size="10.5">支付</text>
    <line x1="50" y1="150" x2="185" y2="150" stroke="var(--warn)" stroke-width="3"/>
    <circle cx="185" cy="150" r="3.5" fill="var(--warn)"/>
    <line x1="185" y1="70" x2="320" y2="70" stroke="var(--done)" stroke-width="3"/>
    <circle cx="185" cy="70" r="3.5" fill="var(--done)"/>
    <text x="90" y="142" fill="var(--warn)" font-size="11">不发生 → $0</text>
    <text x="210" y="62" fill="var(--done)" font-size="11">发生 → $1</text>
    <text x="120" y="196" fill="var(--ink)" font-size="11">没有中间态 — 台阶函数</text>
    <text x="50" y="216" fill="var(--muted)" font-size="10.5">0.30 买入: 赢 +0.70 / 输 −0.30, 开仓即知最坏</text>
  </g>
  <!-- collateral philosophies -->
  <g>
    <rect x="400" y="45" width="140" height="120" rx="10" fill="var(--done-soft)" stroke="var(--done)"/>
    <text x="415" y="66" fill="var(--ink)" font-weight="700">全额抵押</text>
    <rect x="415" y="78" width="110" height="60" rx="5" fill="var(--done)" opacity="0.5"/>
    <text x="424" y="112" fill="var(--ink)" font-size="10.5">锁定 100%</text>
    <text x="415" y="156" fill="var(--muted)" font-size="10.5">违约不可能 · 资本低效</text>
    <rect x="565" y="45" width="140" height="120" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
    <text x="580" y="66" fill="var(--ink)" font-weight="700">保证金化</text>
    <rect x="580" y="118" width="110" height="20" rx="5" fill="var(--accent)" opacity="0.55"/>
    <text x="589" y="132" fill="var(--ink)" font-size="10.5">押一部分</text>
    <text x="580" y="93" fill="var(--warn)" font-size="10.5">缺口→清算瀑布接</text>
    <text x="580" y="156" fill="var(--muted)" font-size="10.5">资本高效 · 违约链回归</text>
  </g>
  <text x="400" y="196" fill="var(--ink)" font-size="11" font-weight="700">CFTC 之争: 0/1 跳变的标的, 塞得进「覆盖最坏波动」的保证金模型吗?</text>
  <text x="400" y="214" fill="var(--muted)" font-size="10.5">事件价格不扩散、直接跳 — 传统模型的数学地基在这裂开。</text>
</svg>
