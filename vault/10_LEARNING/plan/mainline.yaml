# 主线通关路径 (speedrun) — 由终局能力反向收集硬前置闭包得出。
# 81 关 = 52 个终局与机构对话支点 + 29 个闭包拉进的前置; 其余 62 概念 = 支线 (可跳过, 按需顺路)。
# 章节内按拓扑序排列 (apply 校验: 每关的主线前置必须出现在它之前)。
# 消费者: compute_score.py (concept 分 = 主线完成率) + build_learning_view.py (通关视图)。

chapters:
  - n: 0
    title: "序章 · 钱与风险的地图"
    title_en: "Prologue · A Map of Money and Risk"
    question: "为什么这个市场存在? 谁需要它?"
    question_en: "Why does this market exist? Who needs it?"
    concepts:
      - concept:financial-markets
      - concept:price-discovery
      - concept:exchange
      - concept:market-maker
      - concept:clearing
      - concept:clearinghouse
      - concept:settlement
  - n: 1
    title: "第一章 · 盘口的语言"
    title_en: "Ch.1 · The Language of the Order Book"
    question: "我能以这个价格成交多少? 大单会把价格推多远?"
    question_en: "How much can I fill at this price? How far will a large order move it?"
    concepts:
      - concept:order-book
      - concept:bid
      - concept:ask
      - concept:spread
      - concept:depth
      - concept:maker
      - concept:taker
      - concept:liquidity
      - concept:slippage
      - concept:adverse-selection
      - concept:inventory-risk
      - concept:central-limit-order-book
  - n: 2
    title: "第二章 · 风险的合约形态"
    title_en: "Ch.2 · The Shapes Risk Takes"
    question: "我真正暴露于哪个 underlying? 最坏要付多少?"
    question_en: "What am I actually exposed to? What is the worst I can pay?"
    concepts:
      - concept:derivative
      - concept:underlying
      - concept:option
      - concept:binary-option
      - concept:hedging
      - concept:basis-risk
      - concept:leverage
      - concept:collateral
      - concept:margin
      - concept:cross-margin
  - n: 3
    title: "第三章 · 链上最小集"
    title_en: "Ch.3 · The On-Chain Minimum Set"
    question: "哪些必须上链? 哪些链下更合理? 信任假设是什么?"
    question_en: "What must go on-chain, what belongs off-chain, and what am I trusting?"
    concepts:
      - concept:ledger
      - concept:consensus
      - concept:blockchain
      - concept:smart-contract
      - concept:token
      - concept:oracle
      - concept:on-chain
      - concept:off-chain
      - concept:erc-standards
      - concept:erc-20
      - concept:erc-721
      - concept:erc-1155
      - concept:automated-market-maker
  - n: 4
    title: "第四章 · 钱的管道"
    title_en: "Ch.4 · The Plumbing of Money"
    question: "钱在哪个平台? 能否自由转移? 谁能冻结?"
    question_en: "Where is the money held? Can it move freely? Who can freeze it?"
    concepts:
      - concept:custody
      - concept:custody-segregation
      - concept:settlement-rail
      - concept:stablecoin
  - n: 5
    title: "第五章 · 事件市场本体"
    title_en: "Ch.5 · Event Markets Themselves"
    question: "这个 contract 到底承诺什么?"
    question_en: "What is an event contract, and why is its price a probability?"
    concepts:
      - concept:event-risk
      - concept:event-contract
      - concept:outcome-market
      - concept:prediction-market
      - concept:outcome-token
      - concept:implied-probability
      - concept:multi-outcome-market
      - concept:fully-collateralized-market
      - concept:hybrid-exchange-architecture
      - concept:market-maker-incentive
  - n: 6
    title: "第六章 · 结算与争议"
    title_en: "Ch.6 · Settlement and Disputes"
    question: "谁决定事实? 裁错了怎么办?"
    question_en: "Who decides what happened — and what if they get it wrong?"
    concepts:
      - concept:resolution
      - concept:resolution-source
      - concept:contract-semantics
      - concept:oracle-risk
      - concept:dispute-mechanism
      - concept:resolution-risk
      - concept:resolution-insurance
      - concept:settlement-methodology
      - concept:contract-equivalence
      - concept:canonical-event-id
  - n: 7
    title: "第七章 · 机构风险语言"
    title_en: "Ch.7 · The Language Institutions Speak"
    question: "看对方向以后, 还有什么能让我拿不到钱或被迫退出?"
    question_en: "How do I express this exposure in the vocabulary of a risk desk?"
    concepts:
      - concept:value-at-risk
      - concept:event-var
      - concept:counterparty-risk
      - concept:liquidity-risk
      - concept:concentration-risk
      - concept:settlement-risk
      - concept:jurisdiction
      - concept:regulatory-risk
      - concept:regulatory-access
      - concept:inside-information
      - concept:market-integrity
  - n: 8
    title: "终章 · 从知识到系统"
    title_en: "Ch.8 · From Knowledge to Systems"
    question: "要让前面这些判断真正可用，必须先造出什么？"
    question_en: "What has to be built for any of this to be usable at scale?"
    concepts:
      - concept:data-infrastructure
      - concept:auditability
      - concept:risk-engine
      - concept:policy-engine

